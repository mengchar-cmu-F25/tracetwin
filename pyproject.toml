[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetwin"
version = "0.1.0"
description = "Minimize agent-security traces with deterministic paired oracles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mengchao Ren" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mengchar-cmu-F25/tracetwin"
Issues = "https://github.com/mengchar-cmu-F25/tracetwin/issues"

[project.optional-dependencies]
dev = ["build>=1,<2", "pytest>=8,<10"]

[project.scripts]
tracetwin = "tracetwin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracetwin = ["schema/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
