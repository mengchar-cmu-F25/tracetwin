name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - if: matrix.python-version == '3.12'
        run: |
          python -m build
          unzip -l dist/*.whl | grep -q 'tracetwin/schema/case.schema.json'
          tar -tzf dist/*.tar.gz | grep -q 'src/tracetwin/schema/case.schema.json'
          python -m pip install --force-reinstall dist/*.whl
          python -c "import json; from importlib.resources import files; json.loads(files('tracetwin').joinpath('schema/case.schema.json').read_text())"
